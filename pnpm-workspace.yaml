packages:
  - "packages/*"

# Redirect @envoymesh/* internal packages to the sibling EnvoyMesh monorepo.
# pnpm 11 no longer reads `pnpm.overrides` from package.json, and the
# consumer's file: refs only cover direct deps — transitive resolution of
# @envoymesh/protocol (declared by @envoymesh/agent-adapter) still hits the
# npm registry and 404s. Forcing the local file: paths here makes the
# workspace self-contained without modifying the EnvoyMesh checkout.
overrides:
  "@envoymesh/protocol": "link:../../EnvoyMesh/packages/protocol"
  "@envoymesh/identity": "link:../../EnvoyMesh/packages/identity"
  "@envoymesh/agent-adapter": "link:../../EnvoyMesh/packages/agent-adapter"

# Native addons whose build scripts pnpm must run (pnpm 10 blocks them by
# default). koffi is the FFI backend of @deepseek-ai/dsh-fs-local; without
# its binding the hosted fs service fails to load.
onlyBuiltDependencies:
  - koffi
