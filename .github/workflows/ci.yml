name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build + typecheck + test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Module-size lint (Codex LOC rule)
        run: node scripts/check-module-size.mjs packages/envoy-harness/src packages/envoy-harness-adapter/src packages/envoy-harness-tui/src packages/envoy-harness-client/src packages/envoy-harness-cordis/src packages/envoy-harness-peer/src packages/envoy-process/src packages/envoy-harness-web/src

      # Build BEFORE typecheck, and through the root script rather than
      # `pnpm -r run build`. Two reasons, both measured on a clean checkout:
      # (1) packages resolve each other's declarations via `dist`, so
      # typecheck cannot pass before a build; (2) pnpm does not wait for a
      # package's dependencies when running a recursive script, so
      # `pnpm -r run build` starts dependents too early and fails. The root
      # script derives the order from the sources and builds level by level.
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Test
        run: pnpm -r run test
